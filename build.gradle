plugins {
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.insightflow'
version = '0.0.1-SNAPSHOT'

def serviceProjects = [
    ':services:ai-ops-core-service',
    ':services:gateway-service',
    ':services:policy-service',
    ':services:rate-limit-service',
    ':services:usage-service',
    ':services:billing-service',
    ':services:notification-service',
    ':services:recommendation-service'
]

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

project(':shared:common-web') {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.kafka:spring-kafka'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

serviceProjects.each { projectPath ->
    project(projectPath) {
        apply plugin: 'java'
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'

        dependencyManagement {
            imports {
                mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            }
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        dependencies {
            implementation project(':shared:common-web')
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
        }

        if (projectPath in [':services:ai-ops-core-service', ':services:gateway-service', ':services:policy-service', ':services:rate-limit-service']) {
            dependencies {
                implementation 'org.springframework.kafka:spring-kafka'
            }
        }

        if (projectPath == ':services:rate-limit-service') {
            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-data-redis'
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}
