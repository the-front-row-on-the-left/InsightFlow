services:
  postgres:
    image: postgres:16-alpine
    container_name: insightflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insightflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: insightflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    container_name: insightflow-policy-service
    depends_on:
      - kafka
    environment:
      POLICY_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"

  rate-limit-service:
    build:
      context: .
      dockerfile: services/rate-limit-service/Dockerfile
    container_name: insightflow-rate-limit-service
    depends_on:
      - redis
      - kafka
    environment:
      RATE_LIMIT_PORT: 8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_REPOSITORY_TYPE: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8082:8082"

  ai-ops-core-service:
    build:
      context: .
      dockerfile: services/ai-ops-core-service/Dockerfile
    container_name: insightflow-ai-ops-core-service
    depends_on:
      - policy-service
      - rate-limit-service
      - kafka
    environment:
      AI_OPS_CORE_PORT: 8087
      POLICY_SERVICE_BASE_URL: http://policy-service:8081
      RATE_LIMIT_SERVICE_BASE_URL: http://rate-limit-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8087:8087"

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: insightflow-gateway-service
    depends_on:
      - ai-ops-core-service
    environment:
      GATEWAY_PORT: 8080
      AI_OPS_CORE_SERVICE_BASE_URL: http://ai-ops-core-service:8087
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
