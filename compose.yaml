services:
  postgres:
    image: postgres:16-alpine
    container_name: insightflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insightflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: insightflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  usage-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_PROJECT: :services:usage-service
        SERVICE_PATH: services/usage-service
        SERVICE_PORT: 8083
    container_name: insightflow-usage-service
    depends_on:
      - postgres
      - kafka
    environment:
      APP_ENVIRONMENT: docker
      USAGE_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-insightflow}
      DB_USERNAME: ${POSTGRES_USER:-insightflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "${USAGE_PORT:-8083}:8083"

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_PROJECT: :services:billing-service
        SERVICE_PATH: services/billing-service
        SERVICE_PORT: 8084
    container_name: insightflow-billing-service
    depends_on:
      - postgres
      - kafka
    environment:
      APP_ENVIRONMENT: docker
      BILLING_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-insightflow}
      DB_USERNAME: ${POSTGRES_USER:-insightflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-insightflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "${BILLING_PORT:-8084}:8084"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRADLE_PROJECT: :services:notification-service
        SERVICE_PATH: services/notification-service
        SERVICE_PORT: 8085
    container_name: insightflow-notification-service
    depends_on:
      - kafka
    environment:
      APP_ENVIRONMENT: docker
      NOTIFICATION_PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "${NOTIFICATION_PORT:-8085}:8085"

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: insightflow-recommendation-service
    depends_on:
      - usage-service
      - billing-service
    environment:
      APP_ENVIRONMENT: docker
      RECOMMENDATION_PORT: 8086
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-u_demo_001}
      DEFAULT_TEAM_ID: ${DEFAULT_TEAM_ID:-t_demo}
      USAGE_SERVICE_BASE_URL: http://usage-service:8083
      BILLING_SERVICE_BASE_URL: http://billing-service:8084
    ports:
      - "${RECOMMENDATION_PORT:-8086}:8086"

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    container_name: insightflow-policy-service
    depends_on:
      - kafka
    environment:
      POLICY_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"

  rate-limit-service:
    build:
      context: .
      dockerfile: services/rate-limit-service/Dockerfile
    container_name: insightflow-rate-limit-service
    depends_on:
      - redis
      - kafka
    environment:
      RATE_LIMIT_PORT: 8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_REPOSITORY_TYPE: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8082:8082"

  ai-ops-core-service:
    build:
      context: .
      dockerfile: services/ai-ops-core-service/Dockerfile
    container_name: insightflow-ai-ops-core-service
    depends_on:
      - policy-service
      - rate-limit-service
      - kafka
    environment:
      AI_OPS_CORE_PORT: 8087
      POLICY_SERVICE_BASE_URL: http://policy-service:8081
      RATE_LIMIT_SERVICE_BASE_URL: http://rate-limit-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8087:8087"

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: insightflow-gateway-service
    depends_on:
      - ai-ops-core-service
    environment:
      GATEWAY_PORT: 8080
      AI_OPS_CORE_SERVICE_BASE_URL: http://ai-ops-core-service:8087
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
