spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}
    username: ${DB_USERNAME:insightflow}
    password: ${DB_PASSWORD:insightflow}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  flyway:
    enabled: true
    table: billing_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${BILLING_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

insightflow:
  environment: ${APP_ENVIRONMENT:local}
  defaults:
    user-id: ${DEFAULT_USER_ID:u_demo_001}
    team-id: ${DEFAULT_TEAM_ID:t_demo}
  billing:
    price-tables:
      - price-table-version: 2026-02-v1
        service-id: svc_doc_summary
        model: gpt-4o-mini
        pricing-model: per_token
        currency: KRW
        unit-price-input: 0.09
        unit-price-output: 0.35
        unit-price-request: 0
        effective-from: 2026-02-01T00:00:00Z
        effective-to: 2026-02-28T23:59:59Z
        status: inactive
      - price-table-version: 2026-03-v1
        service-id: svc_doc_summary
