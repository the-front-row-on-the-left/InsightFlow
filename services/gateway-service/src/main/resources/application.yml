spring:
  application:
    name: gateway-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

insightflow:
  environment: ${APP_ENVIRONMENT:local}
  ai:
    openai:
      enabled: ${OPENAI_ENABLED:true}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_MODEL:gpt-5-mini}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:45}
  defaults:
    user-id: ${DEFAULT_USER_ID:u_demo_001}
    team-id: ${DEFAULT_TEAM_ID:t_demo}
    user-role: ${DEFAULT_USER_ROLE:platform_user}
  upstream:
    ai-ops-core-service-base-url: ${AI_OPS_CORE_SERVICE_BASE_URL:http://localhost:8087}
