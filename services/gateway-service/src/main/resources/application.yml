spring:
  application:
    name: gateway-service

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

insightflow:
  environment: ${APP_ENVIRONMENT:local}
  defaults:
    user-id: ${DEFAULT_USER_ID:u_demo_001}
    team-id: ${DEFAULT_TEAM_ID:t_demo}
  upstream:
    policy-service-base-url: ${POLICY_SERVICE_BASE_URL:http://localhost:8081}
    rate-limit-service-base-url: ${RATE_LIMIT_SERVICE_BASE_URL:http://localhost:8082}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      ai-requested: ${AI_REQUESTED_TOPIC:ai.requested}
      policy-checked: ${POLICY_CHECKED_TOPIC:policy.checked}
      limit-applied: ${LIMIT_APPLIED_TOPIC:limit.applied}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
