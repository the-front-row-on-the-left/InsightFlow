spring:
  application:
    name: rate-limit-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${RATE_LIMIT_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

insightflow:
  environment: ${APP_ENVIRONMENT:local}
  defaults:
    user-id: ${DEFAULT_USER_ID:u_demo_001}
    team-id: ${DEFAULT_TEAM_ID:t_demo}
    user-role: ${DEFAULT_USER_ROLE:platform_user}
  rate-limit:
    user-daily-limit: ${USER_DAILY_LIMIT:3}
    team-daily-limit: ${TEAM_DAILY_LIMIT:5}
    repository-type: ${RATE_LIMIT_REPOSITORY_TYPE:redis}
  kafka:
    topics:
      limit-applied: ${LIMIT_APPLIED_TOPIC:limit.applied}
