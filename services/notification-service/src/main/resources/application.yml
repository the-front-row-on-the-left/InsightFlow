spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insightflow}
    username: ${DB_USERNAME:insightflow}
    password: ${DB_PASSWORD:insightflow}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: true
    table: notification_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${NOTIFICATION_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info

insightflow:
  environment: ${APP_ENVIRONMENT:local}
  defaults:
    user-id: ${DEFAULT_USER_ID:u_demo_001}
    team-id: ${DEFAULT_TEAM_ID:t_demo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      cost-calculated: ${COST_CALCULATED_TOPIC:cost.calculated}
      limit-exceeded: ${LIMIT_EXCEEDED_TOPIC:limit.exceeded}
